[versions]
agp = "8.13.2"
kotlin = "2.3.21"
ksp = "2.3.12"
coreKtx = "1.15.0"
# A floor: Gradle takes a newer activity if Compose or navigation ask for one.
activityCompose = "1.11.0"
# Jetpack Compose for :app, pinned explicitly (no BOM) to the versions that
# Compose Multiplatform 1.11.1 / CMP material3 1.9.0 / JetBrains lifecycle 2.11.0
# and navigation 2.9.2 resolve to on Android, so adding :sharedUi to :app later
# changes nothing. The icons library is frozen upstream; it stays at today's 1.7.6.
androidxCompose = "1.11.2"
androidxMaterial3 = "1.4.0"
androidxIcons = "1.7.6"
# 2.11 requires AGP 9.1+ and compileSdk 37; stay on 2.9 until the AGP 9 migration.
androidxLifecycle = "2.9.4"
androidxNavigation = "2.9.7"
# Compose Multiplatform for the shared UI (:sharedUi, Android and iOS). On
# Android these resolve to the androidx versions above; material3 1.9.0 is the
# CMP 1.11.1 plugin's own default.
composeMultiplatform = "1.11.1"
cmpMaterial3 = "1.9.0"
# Frozen upstream; its Android variant is androidx material-icons-extended 1.7.6,
# the version :app already uses.
cmpIcons = "1.7.3"
# Coil 3 (multiplatform). 3.4.0 is the last release we can take: 3.5.0 is built
# with Kotlin 2.4 (kotlin-stdlib 2.4.0, newer klibs than our 2.3.21 compiler) and
# 3.6+ pulls Compose Multiplatform 1.12 (androidx compose 1.12). Its Android
# variant depends on androidx lifecycle-runtime 2.9.4, the version :app uses;
# its iOS klibs (built on Compose 1.9.3 / Skiko 0.9.22) link against Compose
# 1.11.1 / Skiko 0.144.6 without a missing signature (klib dump-ir-signatures).
coil3 = "3.4.0"
# Ktor: so far only the iOS engine of Coil's network fetcher (the shared HTTP
# client follows in stage 7); 3.6.0 is built with Kotlin 2.3.21 / coroutines 1.11.
ktor = "3.6.0"
room = "2.8.4"
# SQLite compiled into the iPhone app (Room's driver there). Android keeps the
# framework SQLite through Room's compatibility mode (no driver), as before.
# 2.6.2 is the androidx.sqlite version room-runtime 2.8.4 itself depends on.
sqlite = "2.6.2"
# Kotlin Multiplatform libraries of :shared. atomicfu and kotlinx-datetime are
# declared for the stages that first use them (locks, dates); nothing depends
# on them yet, so they are not on any classpath.
okio = "3.18.2"
serialization = "1.11.0"
atomicfu = "0.33.0"
datetime = "0.8.0"
# The version the Android app has shipped with. Its datastore-preferences-core
# is already multiplatform (jvm, which Android uses, and iOS), so :shared keeps it.
datastore = "1.1.1"
coroutines = "1.11.0"
gson = "2.11.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
okhttp = "4.12.0"
robolectric = "4.14.1"
androidxTestCore = "1.6.1"
retrofit = "2.11.0"
media = "1.7.0"
palette = "1.0.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "androidxCompose" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "androidxCompose" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "androidxCompose" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "androidxCompose" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "androidxCompose" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "androidxCompose" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation", version.ref = "androidxCompose" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "androidxMaterial3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "androidxIcons" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }

# Compose Multiplatform (shared UI in :sharedUi); direct coordinates instead of
# the deprecated compose.* accessors of the Gradle plugin.
jb-compose-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "composeMultiplatform" }
jb-compose-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "composeMultiplatform" }
jb-compose-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "composeMultiplatform" }
jb-compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "cmpMaterial3" }
jb-compose-material-icons-extended = { group = "org.jetbrains.compose.material", name = "material-icons-extended", version.ref = "cmpIcons" }
# Compose Multiplatform resources: the UI fonts of :sharedUi (Res.font.*). On
# Android they are packaged as assets of the library.
jb-compose-resources = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "composeMultiplatform" }
# :shared (AnnotatedString, Color): on Android these resolve to the same
# androidx.compose 1.11.2 artifacts that :app already uses.
jb-compose-ui-graphics = { group = "org.jetbrains.compose.ui", name = "ui-graphics", version.ref = "composeMultiplatform" }
jb-compose-ui-text = { group = "org.jetbrains.compose.ui", name = "ui-text", version.ref = "composeMultiplatform" }

# Multiplatform I/O, JSON, locks and dates (:shared)
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
# iOS only: DataStore's native preferences serializer uses it; pinned to the
# kotlinx-serialization-core version the rest of :shared resolves.
kotlinx-serialization-protobuf = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-protobuf", version.ref = "serialization" }
atomicfu = { group = "org.jetbrains.kotlinx", name = "atomicfu", version.ref = "atomicfu" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "datetime" }

# Cover colours for generated backgrounds (hero, transition)
androidx-palette-ktx = { group = "androidx.palette", name = "palette-ktx", version.ref = "palette" }

# Media session / MediaStyle notification
androidx-media = { group = "androidx.media", name = "media", version.ref = "media" }

# Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }

# Preferences DataStore
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-datastore-preferences-core = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "datastore" }

# Coroutines
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Coil image loading (covers): the Compose integration plus one network fetcher
# per platform (OkHttp on Android, as with Coil 2; Ktor's Darwin engine on iOS).
coil3-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil3" }
coil3-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil3" }
coil3-network-ktor3 = { group = "io.coil-kt.coil3", name = "coil-network-ktor3", version.ref = "coil3" }
ktor-client-darwin = { group = "io.ktor", name = "ktor-client-darwin", version.ref = "ktor" }

# Gson
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# Network
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }

# Testing
# kotlin-test in a multiplatform commonTest: KGP picks kotlin-test-junit for the
# Android unit tests and the native runner for the iOS simulator tests.
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidx-room = { id = "androidx.room", version.ref = "room" }
