# Publishes optimized release APKs; keep this on the release build type.
name: Build and publish update

on:
  push:
    branches: [main]
    # Documentation-only changes do not need a new APK release, and neither do
    # iPhone-only changes (ios-release.yml builds those).
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'iosApp/**'
      - 'altstore/**'
      - '.github/workflows/ios-*.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lumina-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Keep the write token out of .git/config while Gradle and build
          # plugins run; the status steps below pass it explicitly to git push.
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Restore update signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lumina-update.keystore"
          chmod 600 "$RUNNER_TEMP/lumina-update.keystore"

      - name: Choose monotonically increasing version
        run: |
          echo "VERSION_NAME=1.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Test and build APK
        id: build
        shell: bash
        env:
          LUMINA_FLIBUSTA_PROXY: ${{ secrets.LUMINA_FLIBUSTA_PROXY }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease \
            -PversionCodeOverride="$VERSION_CODE" \
            -PversionNameOverride="$VERSION_NAME" \
            -PsigningStoreFile="$RUNNER_TEMP/lumina-update.keystore" \
            -PsigningStorePassword=android \
            -PsigningKeyAlias=AndroidDebugKey \
            -PsigningKeyPassword=android \
            --no-daemon 2>&1 | tee /tmp/lumina-release-build.log

      - name: Verify update signing certificate
        id: certificate
        env:
          EXPECTED_CERT_SHA256: 646f6722051e0d181095efa4a0166f74adb1ff1eb588d1ca06965bd18a618f51
        run: |
          ACTUAL_CERT_SHA256="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/release/app-release.apk "LuminaReader-${VERSION_NAME}.apk"
          sha256sum "LuminaReader-${VERSION_NAME}.apk" > "LuminaReader-${VERSION_NAME}.apk.sha256"

      - name: Publish latest GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "LuminaReader-${VERSION_NAME}.apk" \
              "LuminaReader-${VERSION_NAME}.apk.sha256" \
              --clobber
          else
            # Start the generated notes at the previous Android release, not at an
            # iOS prerelease (ios-v*) that may have been published in between.
            NOTES_START=()
            PREVIOUS_TAG="$(git tag -l 'v[0-9]*' --sort=-version:refname | grep -vx "$TAG" | head -n1 || true)"
            if [ -n "$PREVIOUS_TAG" ]; then
              NOTES_START=(--notes-start-tag "$PREVIOUS_TAG")
            fi
            gh release create "$TAG" \
              "LuminaReader-${VERSION_NAME}.apk" \
              "LuminaReader-${VERSION_NAME}.apk.sha256" \
              --title "Lumina Reader ${VERSION_NAME}" \
              --generate-notes \
              "${NOTES_START[@]}" \
              --latest
          fi

      - name: Record successful deployment
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'status=success\nversion=%s\nsource_sha=%s\n' \
            "$VERSION_NAME" "$GITHUB_SHA" > /tmp/latest-release-status.txt
          git reset --hard HEAD
          git clean -fd
          git checkout -B automation/latest-release-status
          cp /tmp/latest-release-status.txt latest-release-status.txt
          git add latest-release-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record successful release deployment"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/automation/latest-release-status --force

      - name: Record failed deployment
        if: failure()
        shell: bash
        env:
          SIGNING_OUTCOME: ${{ steps.signing.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CERT_OUTCOME: ${{ steps.certificate.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'status=failure'
            echo "source_sha=$GITHUB_SHA"
            echo "signing=$SIGNING_OUTCOME"
            echo "build=$BUILD_OUTCOME"
            echo "certificate=$CERT_OUTCOME"
            echo "publish=$PUBLISH_OUTCOME"
            # The build log stays in the (access-controlled) run logs instead
            # of being committed to a public branch.
            echo "run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/latest-release-status.txt
          git reset --hard HEAD
          git clean -fd
          git checkout -B automation/latest-release-status
          cp /tmp/latest-release-status.txt latest-release-status.txt
          git add latest-release-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record failed release deployment"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/automation/latest-release-status --force
