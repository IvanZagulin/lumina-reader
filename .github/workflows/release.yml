name: Build and publish update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lumina-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply one-time reader pagination fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/lumina/reader/ui/reader/ReaderContent.kt")
          text = path.read_text(encoding="utf-8")

          old = "import androidx.compose.ui.layout.ContentScale\nimport androidx.compose.ui.graphics.graphicsLayer"
          new = "import androidx.compose.ui.layout.ContentScale\nimport androidx.compose.ui.layout.onSizeChanged\nimport androidx.compose.ui.graphics.graphicsLayer"
          assert old in text, "ContentScale import anchor not found"
          text = text.replace(old, new, 1)

          old = "    val visibleChapterTitle = remember(chapter.title, chapter.index) {\n        displayChapterTitle(chapter.title, chapter.index)\n    }\n\n    BoxWithConstraints(modifier = modifier) {"
          new = "    val visibleChapterTitle = remember(chapter.title, chapter.index) {\n        displayChapterTitle(chapter.title, chapter.index)\n    }\n    var measuredBodyHeightPx by remember(chapter.index) { mutableStateOf(0) }\n\n    BoxWithConstraints(modifier = modifier) {"
          assert old in text, "PagedChapterViewer state anchor not found"
          text = text.replace(old, new, 1)

          old = "        // The body is the viewport between the subtle header and footer. Using\n        // the real device constraints is what prevents half-empty pages across\n        // different screen sizes, font sizes and line spacings.\n        val contentHeightPx = with(density) {\n            (maxHeight - 44.dp - 48.dp - 26.dp - 30.dp)\n                .roundToPx()\n                .coerceAtLeast(1)\n        }"
          new = "        // Prefer the body's real measured height. The previous fixed estimate\n        // could be a few pixels taller than the actual weighted viewport, which\n        // let the paginator place one more line than Compose could render and\n        // clip the bottom half of that line. Keep the estimate only for the\n        // first composition, then repaginate from the measured viewport.\n        val estimatedContentHeightPx = with(density) {\n            (maxHeight - 44.dp - 48.dp - 26.dp - 30.dp)\n                .roundToPx()\n                .coerceAtLeast(1)\n        }\n        val contentHeightPx = if (measuredBodyHeightPx > 0) {\n            // Two physical pixels absorb rounding differences between\n            // TextMeasurer and the final Text layout without wasting a line.\n            (measuredBodyHeightPx - 2).coerceAtLeast(1)\n        } else {\n            estimatedContentHeightPx\n        }"
          assert old in text, "contentHeightPx anchor not found"
          text = text.replace(old, new, 1)

          old = "                        Box(\n                            modifier = Modifier\n                                .weight(1f)\n                                .fillMaxWidth()\n                                .clipToBounds()\n                        ) {"
          new = "                        Box(\n                            modifier = Modifier\n                                .weight(1f)\n                                .fillMaxWidth()\n                                .onSizeChanged { size ->\n                                    if (size.height > 0 && measuredBodyHeightPx != size.height) {\n                                        measuredBodyHeightPx = size.height\n                                    }\n                                }\n                                .clipToBounds()\n                        ) {"
          assert old in text, "reader body Box anchor not found"
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Restore update signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lumina-update.keystore"
          chmod 600 "$RUNNER_TEMP/lumina-update.keystore"

      - name: Choose monotonically increasing version
        run: |
          echo "VERSION_NAME=1.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Test and build APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug \
            -PversionCodeOverride="$VERSION_CODE" \
            -PversionNameOverride="$VERSION_NAME" \
            -PsigningStoreFile="$RUNNER_TEMP/lumina-update.keystore" \
            -PsigningStorePassword=android \
            -PsigningKeyAlias=AndroidDebugKey \
            -PsigningKeyPassword=android \
            --no-daemon

      - name: Verify update signing certificate
        env:
          EXPECTED_CERT_SHA256: 646f6722051e0d181095efa4a0166f74adb1ff1eb588d1ca06965bd18a618f51
        run: |
          ACTUAL_CERT_SHA256="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "LuminaReader-${VERSION_NAME}.apk"
          sha256sum "LuminaReader-${VERSION_NAME}.apk" > "LuminaReader-${VERSION_NAME}.apk.sha256"

      - name: Publish latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "LuminaReader-${VERSION_NAME}.apk" \
              "LuminaReader-${VERSION_NAME}.apk.sha256" \
              --clobber
          else
            gh release create "$TAG" \
              "LuminaReader-${VERSION_NAME}.apk" \
              "LuminaReader-${VERSION_NAME}.apk.sha256" \
              --title "Lumina Reader ${VERSION_NAME}" \
              --generate-notes \
              --latest
          fi

      - name: Persist reader fix
        shell: bash
        run: |
          git add app/src/main/java/com/lumina/reader/ui/reader/ReaderContent.kt
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix paged reader bottom-line clipping [skip ci]"
          git push origin HEAD:main
