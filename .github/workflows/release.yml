name: Build and publish update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lumina-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reader status and statistics update
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"Anchor not found: {label}")
              return text.replace(old, new, 1)

          reader = Path("app/src/main/java/com/lumina/reader/ui/reader/ReaderScreen.kt")
          text = reader.read_text(encoding="utf-8")
          old = '''    // Immersive system bars toggle
    DisposableEffect(showControls) {
        val window = (context as? Activity)?.window
        if (window != null) {
            val insetsController = WindowCompat.getInsetsController(window, view)
            insetsController.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
            if (showControls) {
                insetsController.show(WindowInsetsCompat.Type.systemBars())
            } else {
                insetsController.hide(WindowInsetsCompat.Type.systemBars())
            }
        }
        onDispose {
            val window = (context as? Activity)?.window
            if (window != null) {
                val insetsController = WindowCompat.getInsetsController(window, view)
                insetsController.show(WindowInsetsCompat.Type.systemBars())
            }
        }
    }'''
          new = '''    // Keep the status bar visible in reading mode so the clock, battery and
    // system indicators remain available. Only the navigation bar stays immersive
    // while reader controls are hidden.
    DisposableEffect(showControls, settings.theme) {
        val window = (context as? Activity)?.window
        if (window != null) {
            val insetsController = WindowCompat.getInsetsController(window, view)
            insetsController.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
            insetsController.isAppearanceLightStatusBars = when (settings.theme.name) {
                "SEPIA", "CREAM", "LIGHT" -> true
                else -> false
            }
            insetsController.show(WindowInsetsCompat.Type.statusBars())
            if (showControls) {
                insetsController.show(WindowInsetsCompat.Type.navigationBars())
            } else {
                insetsController.hide(WindowInsetsCompat.Type.navigationBars())
            }
        }
        onDispose {
            val window = (context as? Activity)?.window
            if (window != null) {
                val insetsController = WindowCompat.getInsetsController(window, view)
                insetsController.show(WindowInsetsCompat.Type.systemBars())
            }
        }
    }'''
          text = replace_once(text, old, new, "ReaderScreen system bars")
          reader.write_text(text, encoding="utf-8")

          stats = Path("app/src/main/java/com/lumina/reader/ui/stats/StatsScreen.kt")
          text = stats.read_text(encoding="utf-8")
          old = '''                item { SectionTitle("Библиотека", Icons.AutoMirrored.Filled.MenuBook) }

                item { LibraryCard(state) }

                if (state.mostReadBooks.isNotEmpty()) {
                    item { SectionTitle("Больше всего читали", Icons.Default.EmojiEvents) }

                    itemsIndexed(
                        items = state.mostReadBooks,
                        key = { _, item -> item.bookId }
                    ) { index, book ->
                        TopBookCard(
                            rank = index + 1,
                            book = book,
                            maximumDuration = state.mostReadBooks.maxOf { it.durationSeconds }
                        )
                    }
                }



                if (state.ignoredSessionCount > 0) {'''
          new = '''                item { SectionTitle("Ещё немного цифр", Icons.Default.History) }

                item {
                    Row(
                        modifier = Modifier.fillMaxWidth(),
                        horizontalArrangement = Arrangement.spacedBy(10.dp)
                    ) {
                        InsightCard(
                            title = "Всего сессий",
                            value = formatNumber(state.allTime.sessionCount.toLong()),
                            icon = Icons.Default.History,
                            color = StatsBlue,
                            modifier = Modifier.weight(1f)
                        )
                        InsightCard(
                            title = "Примерно страниц",
                            value = formatNumber(state.allTime.estimatedPages),
                            icon = Icons.Default.AutoStories,
                            color = StatsPurple,
                            modifier = Modifier.weight(1f)
                        )
                    }
                }

                item {
                    Row(
                        modifier = Modifier.fillMaxWidth(),
                        horizontalArrangement = Arrangement.spacedBy(10.dp)
                    ) {
                        InsightCard(
                            title = "Рекорд серии",
                            value = "${state.bestStreakDays} ${dayWord(state.bestStreakDays)}",
                            icon = Icons.Default.LocalFireDepartment,
                            color = StatsOrange,
                            modifier = Modifier.weight(1f)
                        )
                        InsightCard(
                            title = "Книг открыто",
                            value = formatNumber(state.allTime.bookCount.toLong()),
                            icon = Icons.AutoMirrored.Filled.MenuBook,
                            color = StatsGreen,
                            modifier = Modifier.weight(1f)
                        )
                    }
                }

                item { SectionTitle("Библиотека", Icons.AutoMirrored.Filled.MenuBook) }

                item { LibraryCard(state) }

                if (state.recentSessions.isNotEmpty()) {
                    item { SectionTitle("Последние чтения", Icons.Default.History) }

                    itemsIndexed(
                        items = state.recentSessions.take(5),
                        key = { _, session -> session.id }
                    ) { _, session ->
                        RecentSessionCard(session)
                    }
                }

                if (state.ignoredSessionCount > 0) {'''
          text = replace_once(text, old, new, "replace most-read section")
          stats.write_text(text, encoding="utf-8")
          PY

      - name: Check patch formatting
        run: git diff --check

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Restore update signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lumina-update.keystore"
          chmod 600 "$RUNNER_TEMP/lumina-update.keystore"

      - name: Choose monotonically increasing version
        run: |
          echo "VERSION_NAME=1.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Test and build APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug \
            -PversionCodeOverride="$VERSION_CODE" \
            -PversionNameOverride="$VERSION_NAME" \
            -PsigningStoreFile="$RUNNER_TEMP/lumina-update.keystore" \
            -PsigningStorePassword=android \
            -PsigningKeyAlias=AndroidDebugKey \
            -PsigningKeyPassword=android \
            --no-daemon

      - name: Verify update signing certificate
        env:
          EXPECTED_CERT_SHA256: 646f6722051e0d181095efa4a0166f74adb1ff1eb588d1ca06965bd18a618f51
        run: |
          ACTUAL_CERT_SHA256="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "LuminaReader-${VERSION_NAME}.apk"
          sha256sum "LuminaReader-${VERSION_NAME}.apk" > "LuminaReader-${VERSION_NAME}.apk.sha256"

      - name: Publish latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "LuminaReader-${VERSION_NAME}.apk" \
              "LuminaReader-${VERSION_NAME}.apk.sha256" \
              --clobber
          else
            gh release create "$TAG" \
              "LuminaReader-${VERSION_NAME}.apk" \
              "LuminaReader-${VERSION_NAME}.apk.sha256" \
              --title "Lumina Reader ${VERSION_NAME}" \
              --generate-notes \
              --latest
          fi

      - name: Persist validated source changes
        shell: bash
        run: |
          git add \
            app/src/main/java/com/lumina/reader/ui/reader/ReaderScreen.kt \
            app/src/main/java/com/lumina/reader/ui/stats/StatsScreen.kt
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Show reader status bar and refresh statistics [skip ci]"
          git push origin HEAD:main
