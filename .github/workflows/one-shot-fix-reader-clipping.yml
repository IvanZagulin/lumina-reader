name: Deploy reader status and stats update

on:
  push:
    branches:
      - automation/fix-reader-page-clipping

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Apply requested changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Anchor not found: {label}")
              return text.replace(old, new, 1)

          reader = Path("app/src/main/java/com/lumina/reader/ui/reader/ReaderScreen.kt")
          text = reader.read_text(encoding="utf-8")
          old = '''    // Immersive system bars toggle
    DisposableEffect(showControls) {
        val window = (context as? Activity)?.window
        if (window != null) {
            val insetsController = WindowCompat.getInsetsController(window, view)
            insetsController.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
            if (showControls) {
                insetsController.show(WindowInsetsCompat.Type.systemBars())
            } else {
                insetsController.hide(WindowInsetsCompat.Type.systemBars())
            }
        }
        onDispose {
            val window = (context as? Activity)?.window
            if (window != null) {
                val insetsController = WindowCompat.getInsetsController(window, view)
                insetsController.show(WindowInsetsCompat.Type.systemBars())
            }
        }
    }'''
          new = '''    // Keep the Android status bar visible in reading mode so the clock,
    // battery level and system indicators are always available. Only the
    // navigation bar stays immersive while reader controls are hidden.
    DisposableEffect(showControls, settings.theme) {
        val window = (context as? Activity)?.window
        if (window != null) {
            val insetsController = WindowCompat.getInsetsController(window, view)
            insetsController.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
            insetsController.isAppearanceLightStatusBars = when (settings.theme.name) {
                "SEPIA", "CREAM", "LIGHT" -> true
                else -> false
            }
            insetsController.show(WindowInsetsCompat.Type.statusBars())
            if (showControls) {
                insetsController.show(WindowInsetsCompat.Type.navigationBars())
            } else {
                insetsController.hide(WindowInsetsCompat.Type.navigationBars())
            }
        }
        onDispose {
            val window = (context as? Activity)?.window
            if (window != null) {
                val insetsController = WindowCompat.getInsetsController(window, view)
                insetsController.show(WindowInsetsCompat.Type.systemBars())
            }
        }
    }'''
          reader.write_text(replace_once(text, old, new, "reader system bars"), encoding="utf-8")

          stats = Path("app/src/main/java/com/lumina/reader/ui/stats/StatsScreen.kt")
          text = stats.read_text(encoding="utf-8")
          old = '''                item { SectionTitle("Библиотека", Icons.AutoMirrored.Filled.MenuBook) }

                item { LibraryCard(state) }

                if (state.mostReadBooks.isNotEmpty()) {
                    item { SectionTitle("Больше всего читали", Icons.Default.EmojiEvents) }

                    itemsIndexed(
                        items = state.mostReadBooks,
                        key = { _, item -> item.bookId }
                    ) { index, book ->
                        TopBookCard(
                            rank = index + 1,
                            book = book,
                            maximumDuration = state.mostReadBooks.maxOf { it.durationSeconds }
                        )
                    }
                }



                if (state.ignoredSessionCount > 0) {'''
          new = '''                item { SectionTitle("Ещё немного цифр", Icons.Default.History) }

                item {
                    Row(
                        modifier = Modifier.fillMaxWidth(),
                        horizontalArrangement = Arrangement.spacedBy(10.dp)
                    ) {
                        InsightCard(
                            title = "Всего сессий",
                            value = formatNumber(state.allTime.sessionCount.toLong()),
                            icon = Icons.Default.History,
                            color = StatsBlue,
                            modifier = Modifier.weight(1f)
                        )
                        InsightCard(
                            title = "Примерно страниц",
                            value = formatNumber(state.allTime.estimatedPages),
                            icon = Icons.Default.AutoStories,
                            color = StatsPurple,
                            modifier = Modifier.weight(1f)
                        )
                    }
                }

                item {
                    Row(
                        modifier = Modifier.fillMaxWidth(),
                        horizontalArrangement = Arrangement.spacedBy(10.dp)
                    ) {
                        InsightCard(
                            title = "Рекорд серии",
                            value = "${state.bestStreakDays} ${dayWord(state.bestStreakDays)}",
                            icon = Icons.Default.LocalFireDepartment,
                            color = StatsOrange,
                            modifier = Modifier.weight(1f)
                        )
                        InsightCard(
                            title = "Книг открыто",
                            value = formatNumber(state.allTime.bookCount.toLong()),
                            icon = Icons.AutoMirrored.Filled.MenuBook,
                            color = StatsGreen,
                            modifier = Modifier.weight(1f)
                        )
                    }
                }

                item { SectionTitle("Последние чтения", Icons.Default.History) }

                if (state.recentSessions.isNotEmpty()) {
                    itemsIndexed(
                        items = state.recentSessions.take(5),
                        key = { _, session -> session.id }
                    ) { _, session ->
                        RecentSessionCard(session)
                    }
                } else {
                    item {
                        Text(
                            text = "Недавних сессий пока нет",
                            style = MaterialTheme.typography.bodySmall,
                            color = MaterialTheme.colorScheme.onSurfaceVariant
                        )
                    }
                }

                item { SectionTitle("Библиотека", Icons.AutoMirrored.Filled.MenuBook) }
                item { LibraryCard(state) }

                if (state.ignoredSessionCount > 0) {'''
          stats.write_text(replace_once(text, old, new, "stats most-read section"), encoding="utf-8")
          PY
          git diff --check

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and test
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon 2>&1 | tee /tmp/reader-stats-build.log

      - name: Persist validated source to main
        id: persist
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          git add \
            app/src/main/java/com/lumina/reader/ui/reader/ReaderScreen.kt \
            app/src/main/java/com/lumina/reader/ui/stats/StatsScreen.kt
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Show reader status bar and refresh statistics"
          git push origin HEAD:main
          git rev-parse HEAD > /tmp/main-source-sha.txt

      - name: Publish deployment result
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
        run: |
          {
            echo "build=$BUILD_OUTCOME"
            echo "persist=$PERSIST_OUTCOME"
            if [ -f /tmp/main-source-sha.txt ]; then
              echo "main_source_sha=$(cat /tmp/main-source-sha.txt)"
            fi
            echo
            if [ -f /tmp/reader-stats-build.log ]; then
              tail -n 500 /tmp/reader-stats-build.log
            fi
          } > /tmp/reader-stats-result.txt

          git reset --hard HEAD
          git clean -fd
          git checkout -B automation/reader-stats-result
          cp /tmp/reader-stats-result.txt reader-stats-result.txt
          git add reader-stats-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record reader stats deployment result"
          git push origin HEAD:refs/heads/automation/reader-stats-result --force

      - name: Fail if validation or persist failed
        if: steps.build.outcome != 'success' || steps.persist.outcome != 'success'
        run: exit 1
