name: Actions smoke test

on:
  push:
    branches:
      - automation/fix-reader-page-clipping

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Publish smoke marker
        shell: bash
        run: |
          printf 'GitHub Actions runner started successfully\n' > ci-smoke.txt
          git add ci-smoke.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record Actions smoke test"
          git push origin HEAD:refs/heads/automation/ci-smoke-result --force
