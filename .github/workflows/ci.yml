# Verifies work branches without publishing anything. Releases are built by
# release.yml from main only.
name: CI

on:
  push:
    branches-ignore: [main, automation/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Unit tests and debug build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --continue

      - name: Android dependency baseline
        if: always()
        run: |
          mkdir -p build
          ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath --no-daemon \
            | grep -oE '[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+:[^ ]+( -> [^ ]+)?' \
            | sed -E 's/^([^:]+:[^:]+):[^ ]+ -> (.+)$/\1:\2/' | sort -u > build/release-deps.txt || true

      - name: Upload dependency baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-deps
          path: build/release-deps.txt
          if-no-files-found: ignore

      # Room exports the database schema of :shared (shared/schemas/...); a new
      # or changed file here is a schema change to review and commit.
      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: shared/schemas
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          # testDebugUnitTest also runs :shared's and :sharedUi's commonTest on the JVM.
          path: |
            app/build/reports/tests
            shared/build/reports/tests
            sharedUi/build/reports/tests
          if-no-files-found: ignore
