# Compiles and tests the Kotlin Multiplatform code for iOS and launches the
# iPhone app on a simulator (screenshots are uploaded as an artifact). Android
# is verified by ci.yml (Linux); nothing here publishes anything.
name: iOS CI

on:
  push:
    branches-ignore: [automation/**]
    paths:
      - 'shared/**'
      - 'sharedUi/**'
      - 'iosApp/**'
      - 'altstore/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ios-*.yml'
  pull_request:
    paths:
      - 'shared/**'
      - 'sharedUi/**'
      - 'iosApp/**'
      - 'altstore/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ios-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: Kotlin/Native compile and simulator tests
    runs-on: macos-15
    # The first run downloads the Kotlin/Native toolchain (~1 GB); later runs
    # restore it from the ~/.konan cache.
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Select Xcode 26
        shell: bash
        run: |
          # Kotlin 2.3.21 is tested against Xcode 26.0; prefer it, then any
          # Xcode 26, and fall back to the runner's default Xcode.
          shopt -s nullglob
          candidates=(/Applications/Xcode_26.0*.app)
          if [ "${#candidates[@]}" -eq 0 ]; then candidates=(/Applications/Xcode_26*.app); fi
          XCODE=""
          if [ "${#candidates[@]}" -gt 0 ]; then
            XCODE="$(printf '%s\n' "${candidates[@]}" | sort | tail -n 1)"
          fi
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE/Contents/Developer"
            echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          else
            echo "::warning::Xcode 26 is not installed on this runner; using $(xcode-select -p)"
          fi
          xcodebuild -version
          xcrun simctl list runtimes available

      - name: AltStore source script tests
        shell: bash
        run: python3 -m unittest discover -s altstore -v

      - name: Compile, link and test for iOS
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew \
            :shared:compileKotlinIosArm64 \
            :sharedUi:compileKotlinIosArm64 \
            :sharedUi:linkReleaseFrameworkIosArm64 \
            :shared:iosSimulatorArm64Test \
            --no-daemon --stacktrace --continue

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: |
            shared/build/reports/tests
            shared/build/test-results
          if-no-files-found: ignore

  simulator-smoke:
    name: Simulator launch and screenshots
    needs: shared
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Select Xcode 26
        shell: bash
        run: |
          shopt -s nullglob
          candidates=(/Applications/Xcode_26.0*.app)
          if [ "${#candidates[@]}" -eq 0 ]; then candidates=(/Applications/Xcode_26*.app); fi
          XCODE=""
          if [ "${#candidates[@]}" -gt 0 ]; then
            XCODE="$(printf '%s\n' "${candidates[@]}" | sort | tail -n 1)"
          fi
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE/Contents/Developer"
            echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          else
            echo "::warning::Xcode 26 is not installed on this runner; using $(xcode-select -p)"
          fi
          xcodebuild -version

      - name: Generate the Xcode project
        shell: bash
        run: |
          brew install xcodegen
          xcodegen --version
          cd iosApp
          xcodegen generate

      - name: Pick an iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          # Prefer the newest iOS runtime that the selected Xcode's SDK supports
          # (the image also carries runtimes of newer Xcodes); otherwise take the
          # newest available one. Any iPhone works: the app is built for the
          # generic simulator destination and installed with simctl.
          SDK_VERSION="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "iPhone simulator SDK: $SDK_VERSION"
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          SIM_UDID="$(python3 - "$RUNNER_TEMP/devices.json" "$SDK_VERSION" <<'PY'
          import json
          import re
          import sys

          devices = json.load(open(sys.argv[1]))["devices"]
          sdk = tuple(int(part) for part in (sys.argv[2].split(".") + ["0"])[:2])
          candidates = []
          for runtime, entries in devices.items():
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not match:
                  continue
              version = (int(match.group(1)), int(match.group(2)))
              for device in entries:
                  if device.get("isAvailable", True) and device["name"].startswith("iPhone"):
                      # Supported by this SDK first, then the newest runtime, then
                      # the plainest name ("iPhone 17" before "iPhone 17 Pro Max").
                      candidates.append((version <= sdk, version, -len(device["name"]), device["udid"], device["name"], runtime))
          if not candidates:
              sys.exit("No available iPhone simulator")
          best = max(candidates)
          print(f"Simulator: {best[4]} ({best[5]})", file=sys.stderr)
          print(best[3])
          PY
          )"
          test -n "$SIM_UDID"
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"

      - name: Link the Kotlin framework for the simulator
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :sharedUi:linkDebugFrameworkIosSimulatorArm64 --no-daemon --stacktrace

      - name: Build the app for the simulator
        shell: bash
        run: |
          set -euo pipefail
          # arm64 only: Kotlin/Native and Compose Multiplatform have no x86_64
          # simulator slice. The Xcode build phase reuses the linked framework.
          # Generic destination: the build does not depend on which simulator
          # runtimes this Xcode accepts; the next step installs it with simctl.
          xcodebuild \
            -project iosApp/LuminaReader.xcodeproj \
            -scheme LuminaReader \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Launch on the simulator and take screenshots
        shell: bash
        run: |
          set -euo pipefail
          APP=build/sim/Build/Products/Debug-iphonesimulator/LuminaReader.app
          plutil -p "$APP/Info.plist"
          mkdir -p shots
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl install "$SIM_UDID" "$APP"
          # Routes grow as screens move to Compose Multiplatform (stage 8+).
          for route in home; do
            for appearance in light dark; do
              xcrun simctl ui "$SIM_UDID" appearance "$appearance"
              LAUNCH="$(xcrun simctl launch --terminate-running-process "$SIM_UDID" com.lumina.reader -startRoute "$route")"
              echo "$LAUNCH"
              PID="${LAUNCH##*: }"
              case "$PID" in
                ''|*[!0-9]*) echo "::error::Could not launch LuminaReader: $LAUNCH"; exit 1 ;;
              esac
              sleep 12
              xcrun simctl io "$SIM_UDID" screenshot "shots/$route-$appearance.png"
              if ! kill -0 "$PID" 2>/dev/null; then
                echo "::error::LuminaReader exited within 12 s (route $route, $appearance)"
                exit 1
              fi
            done
          done
          ls -la shots

      - name: Collect simulator logs
        if: failure()
        shell: bash
        run: |
          mkdir -p shots
          if [ -n "${SIM_UDID:-}" ]; then
            xcrun simctl spawn "$SIM_UDID" log show --last 5m --style compact \
              --predicate 'process == "LuminaReader"' > shots/simulator.log 2>&1 || true
          fi
          find ~/Library/Logs/DiagnosticReports -name 'LuminaReader*' -exec cp {} shots/ \; 2>/dev/null || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshots
          path: shots
          if-no-files-found: ignore
