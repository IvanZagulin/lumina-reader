# XcodeGen spec of the iPhone host app. CI generates LuminaReader.xcodeproj from
# it (brew install xcodegen && cd iosApp && xcodegen generate); the .xcodeproj is
# not committed. All UI and logic live in Kotlin (:sharedUi -> LuminaUI.framework).
name: LuminaReader

options:
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: ru
  createIntermediateGroups: true

targets:
  LuminaReader:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      # Swift host, Info.plist (never copied as a resource) and Assets.xcassets
      - path: LuminaReader
    dependencies:
      # LuminaUI is a static framework, so the system frameworks its Kotlin code
      # uses must be linked by the app: the reading reminder is a local notification.
      - sdk: UserNotifications.framework
    settings:
      base:
        PRODUCT_NAME: LuminaReader
        PRODUCT_BUNDLE_IDENTIFIER: com.lumina.reader
        # CI overrides both: MARKETING_VERSION=1.0.<run>, CURRENT_PROJECT_VERSION=<run>
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: LuminaReader/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_VERSION: "5.0"
        # iPhone only, portrait only (Info.plist) for the first builds
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Kotlin/Native and Compose Multiplatform 1.11 build arm64 only; an x86_64
        # simulator slice would make the Kotlin framework tasks fail.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        # The Kotlin framework is produced by the "Compile Kotlin" phase below.
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../sharedUi/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "LuminaUI"
        # The Gradle tasks write outside the sandbox (Kotlin and Compose plugins
        # refuse to run with it).
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # Unsigned builds: AltStore re-signs the .ipa with the user's Apple ID.
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    preBuildScripts:
      - name: Compile Kotlin
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          set -e
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle: OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES (the IDE builds the framework)"
            exit 0
          fi
          if [ -z "$JAVA_HOME" ] && [ -x /usr/libexec/java_home ]; then
            JAVA_HOME="$(/usr/libexec/java_home -v 17+ 2>/dev/null || true)"
            export JAVA_HOME
          fi
          cd "$SRCROOT/.."
          ./gradlew :sharedUi:embedAndSignAppleFrameworkForXcode --no-daemon

schemes:
  LuminaReader:
    build:
      targets:
        LuminaReader: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
